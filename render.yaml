services:
  - type: web
    name: nexus-chat-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: nexus-chat-client
          property: host

  - type: web
    name: nexus-chat-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SERVER_URL
        fromService:
          type: web
          name: nexus-chat-api
          property: host
